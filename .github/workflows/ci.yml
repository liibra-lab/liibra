name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # Audit at critical only. The current SvelteKit/wrangler toolchain pulls
      # transitive dev-time advisories (cookie, esbuild) whose suggested fixes are
      # nonsensical downgrades; none affect the Workers production build.
      - name: Audit dependencies
        run: npm audit --audit-level=critical

      # The next four steps are `npm run gate`, split up so a failure names
      # its step in the Actions UI.
      - name: Check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (Cloudflare Workers)
        run: npm run build
