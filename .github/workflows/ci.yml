name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # Audit at moderate: the threshold is the *minimum* severity that fails the
      # command, and the remotely-reachable advisories that matter here have been
      # Moderate (e.g. the SvelteKit Accept-header ReDoS), so a `high` gate would
      # let them through.
      #
      # One known finding sits below this line: GHSA-pxg6-pf52-xh8x (cookie, Low).
      # SvelteKit pins `cookie: ^0.6.0`, so it is unfixable in range — `audit fix
      # --force` "resolves" it by installing @sveltejs/kit@0.0.30, which breaks the
      # Workers build. It is not reachable regardless: the advisory concerns cookie
      # name/path/domain, and src/routes/lang/+server.ts writes a constant name,
      # a constant path, and no domain. Revisit when SvelteKit bumps `cookie`.
      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      # The next four steps are `npm run gate`, split up so a failure names
      # its step in the Actions UI.
      - name: Check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (Cloudflare Workers)
        run: npm run build

      # Smoke tests exercise the built Worker in the real Workers runtime
      # (wrangler dev). Upstreams may be up or down; the suite accepts both,
      # asserting the pages render honestly either way.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test (wrangler dev)
        run: npm run test:e2e
